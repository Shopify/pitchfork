---
name: Test

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }} / Rack ${{ matrix.rack }} ${{ matrix.rubyopt }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        ruby: ["ruby-head", "3.4", "3.3", "3.2"]
        rubyopt: [""]
        rack: ["~> 3.2"]
        include:
          - os: "ubuntu-latest"
            ruby: "3.4"
            rubyopt: "--enable-frozen-string-literal"
            rack: "~> 3.2"
          - os: "ubuntu-latest"
            ruby: "3.4"
            rack: "~> 3.1.0"
          - os: "ubuntu-latest"
            ruby: "3.4"
            rack: "~> 3.0.0"
          - os: "ubuntu-latest"
            ruby: "3.4"
            rack: "~> 2.0"
          # setup-ruby only has prebuilt binaries of these up to ubuntu-24.04
          - os: "ubuntu-24.04"
            ruby: "3.1"
            rack: "~> 3.2"
          - os: "ubuntu-24.04"
            ruby: "3.0"
            rack: "~> 3.2"
          - os: "ubuntu-24.04"
            ruby: "2.7"
            rack: "~> 3.2"
          - os: "ubuntu-24.04"
            ruby: "2.6"
            rack: "~> 3.2"
    env:
      RACK_VERSION: "${{ matrix.rack }}"
      RUBYOPT: "${{ matrix.rubyopt }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install packages
        run: sudo apt-get install -y ragel socat netcat-openbsd

      - name: Tests Rack ${{ matrix.rack }} ${{ matrix.rubyopt }}
        run: bundle exec rake

      - name: Ensure ragel output is up-to-date
        run: git diff --exit-code
